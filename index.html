
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>بوابة خورفكان الإدارية</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #f8fafc; }

  #loadingScreen {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #0f766e, #134e4a);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    z-index: 10;
    transition: opacity .4s ease;
  }
  #loadingScreen.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 48px; height: 48px;
    border: 4px solid rgba(255,255,255,0.25);
    border-top-color: #e6b325;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
    margin-bottom: 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loadingScreen h1 { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
  #loadingScreen p { font-size: 13px; opacity: 0.8; }

  #appFrame {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
  }
</style>
</head>
<body>

  <div id="loadingScreen">
    <div class="spinner"></div>
    <h1>بوابة خورفكان الإدارية</h1>
    <p>جارِ تحميل النظام...</p>
  </div>

  <!-- ⚠️ غيّر الرابط ده لرابط نشر Apps Script بتاعك (ينتهي بـ /exec) -->
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbxH3Q99G0dM0xxWwKSOO3Lds9HJnPi0UG_JCpzHXRAEx3o2tf18mI0Zfws7T0bjsKlNLg/exec"
    allow="clipboard-write; microphone"
    referrerpolicy="no-referrer-when-downgrade">
  </iframe>

  <script>
    var frame = document.getElementById('appFrame');
    var loading = document.getElementById('loadingScreen');
    frame.addEventListener('load', function () {
      loading.classList.add('hidden');
    });
    // حماية احتياطية: لو حصل تأخير غير متوقع، اخفِ شاشة التحميل بعد 8 ثوانٍ برضه
    setTimeout(function () { loading.classList.add('hidden'); }, 8000);

    // استقبال طلبات التنقّل من داخل النظام — بنغيّر مصدر الإطار مباشرة بدل تنقّل الصفحة
    // بالكامل، فرابط khorfakkan-portal.pages.dev يفضل ثابت في المتصفح مهما تنقّلت جوّه النظام
    window.addEventListener('message', function (event) {
      console.log('[index.html] رسالة وصلت من:', event.origin, event.data);
      // رد فوري على استكشاف وجود الغلاف — بيحصل وقت تحميل كل صفحة (مش وقت التنقّل نفسه)
      // عشان النظام يحسم بدري وبثقة إن الغلاف موجود، من غير أي سباق زمني وقت الضغط على رابط
      if (event.data && event.data.type === 'khorfakkanPing') {
        if (event.source) {
          try { event.source.postMessage({ type: 'khorfakkanPingAck' }, '*'); } catch (e) { /* تجاهل */ }
        }
        return;
      }
      if (event.data && event.data.type === 'khorfakkanNavigate' && event.data.url) {
        console.log('[index.html] تنفيذ التنقّل — تغيير src للإطار');
        frame.src = event.data.url;
        if (event.source) {
          try { event.source.postMessage({ type: 'khorfakkanNavigateAck' }, '*'); } catch (e) { /* تجاهل */ }
        }
      }
    });
  </script>

</body>
</html>
