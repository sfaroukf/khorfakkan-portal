<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>بوابة خورفكان الإدارية</title>
</head>
<body>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const page = q.get('page');
  const map = {
    Dashboard:'/dashboard',
    Requests:'/requests',
    Admin:'/admin',
    Statistics:'/statistics',
    Assistant:'/assistant'
  };
  const target = map[page] || '/dashboard';
  const out = new URL(target, location.origin);
  ['staffToken','ai','_r'].forEach(k => {
    const v = q.get(k);
    if (v) out.searchParams.set(k, v);
  });
  location.replace(out.toString());
})();
</script>
</body>
</html>
