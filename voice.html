<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل صوتي</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg, #0f766e, #134e4a);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    text-align: center;
    padding: 24px;
  }
  h2 { font-size: 18px; margin-bottom: 24px; }
  #micBtn {
    width: 96px; height: 96px;
    border-radius: 50%;
    background: #e6b325;
    border: none;
    font-size: 40px;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    transition: transform .15s;
  }
  #micBtn:active { transform: scale(0.95); }
  #micBtn.listening {
    background: #ef4444;
    animation: pulse 1.1s infinite;
  }
  #micBtn:disabled { opacity: 0.4; cursor: not-allowed; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.6); }
    50% { box-shadow: 0 0 0 22px rgba(239,68,68,0); }
  }
  #status { margin-top: 20px; font-size: 14px; opacity: 0.85; min-height: 20px; }
  #transcript { margin-top: 14px; font-size: 17px; font-weight: 700; min-height: 26px; max-width: 320px; }
</style>
</head>
<body>

  <h2>🎤 بسمعك دلوقتي...</h2>
  <button id="micBtn">🎤</button>
  <div id="status">جهّز نفسك وابدأ الكلام</div>
  <div id="transcript"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const lang = params.get('lang') === 'en' ? 'en-US' : 'ar-SA';

    const micBtn = document.getElementById('micBtn');
    const statusEl = document.getElementById('status');
    const transcriptEl = document.getElementById('transcript');

    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRec) {
      statusEl.textContent = 'المتصفح ده مش بيدعم التسجيل الصوتي. جرّب من Chrome.';
      micBtn.disabled = true;
    } else {
      function startListening() {
        const recognition = new SpeechRec();
        recognition.lang = lang;
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        micBtn.classList.add('listening');
        statusEl.textContent = 'بسمعك دلوقتي...';
        transcriptEl.textContent = '';

        recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript;
          transcriptEl.textContent = transcript;
          statusEl.textContent = 'تم ✔ جارِ الإرسال...';
          if (window.opener) {
            window.opener.postMessage({ type: 'voiceTranscript', text: transcript }, '*');
          }
          setTimeout(() => window.close(), 900);
        };

        recognition.onerror = (e) => {
          micBtn.classList.remove('listening');
          if (e.error === 'not-allowed') {
            statusEl.textContent = 'محتاج تسمح بصلاحية المايك — دوس على الزر تاني بعد السماح.';
          } else if (e.error === 'no-speech') {
            statusEl.textContent = 'مسمعتش صوت. دوس على المايك وجرّب تاني.';
          } else {
            statusEl.textContent = 'حصل خطأ (' + e.error + '). دوس على المايك وجرّب تاني.';
          }
        };

        recognition.onend = () => {
          micBtn.classList.remove('listening');
        };

        try {
          recognition.start();
        } catch (e) {
          statusEl.textContent = 'دوس على المايك عشان تبدأ.';
          micBtn.classList.remove('listening');
        }
      }

      // بدء تلقائي فور تحميل الصفحة — يقلل الاحتكاك لضغطة واحدة فقط في التطبيق الرئيسي
      // (بعض المتصفحات ممكن تمنع البدء التلقائي، فالزر بيفضل شغّال كخيار احتياطي فورًا)
      window.addEventListener('load', () => {
        setTimeout(startListening, 250);
      });

      micBtn.addEventListener('click', startListening);
    }
  </script>

</body>
</html>
